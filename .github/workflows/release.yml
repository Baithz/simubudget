name: Release SimuBudget

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-windows:
    name: Build & Release Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run type-check

      - name: Validate Rust tests
        run: npm run test:rust

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SimuBudget ${{ github.ref_name }}"
          releaseBody: |
            ## SimuBudget ${{ github.ref_name }}

            ### Installation
            - Téléchargez `SimuBudget_x.x.x_x64-setup.exe` pour l'installateur guidé recommandé.
            - Téléchargez `SimuBudget_x.x.x_x64_en-US.msi` pour le MSI entreprise.

            ### Mise à jour automatique
            Si vous avez déjà SimuBudget installé, la mise à jour sera proposée automatiquement au prochain démarrage.

            ### Version
            - Version applicative : ${{ github.ref_name }}
            - Artefact updater attendu : `latest.json`
          releaseDraft: false
          prerelease: false
