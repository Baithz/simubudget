[package]
name    = "simubudget"
version = "2.0.0"
edition = "2021"
authors = ["KREMER Regis"]
description = "SimuBudget - Copilote financier personnel"

[lib]
name = "simubudget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "simubudget"
path = "src/main.rs"

[dependencies]
tauri               = { version = "2", features = ["devtools"] }
tauri-plugin-shell  = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
tauri-plugin-updater = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
rusqlite     = { version = "0.31", features = ["bundled"] }
chrono       = { version = "0.4", features = ["serde"] }
thiserror    = "1"
log          = "0.4"
env_logger   = "0.11"
uuid         = { version = "1", features = ["v4"] }

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level     = "s"
strip         = true
lto           = true
codegen-units = 1
panic         = "abort"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
